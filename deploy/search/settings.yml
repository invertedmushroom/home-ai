# Keep the upstream engine implementations, with exactly these selectable engines.
use_default_settings:
  engines:
    keep_only: [brave]

general:
  debug: false
  instance_name: Deep search probe

search:
  autocomplete: ''
  formats: [json]

server:
  # The container receives a locally generated SEARXNG_SECRET.
  secret_key: unused-environment-override-required
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 4.0
  retries: 0

engines:
  - name: brave
    disabled: false
    timeout: 4.0
