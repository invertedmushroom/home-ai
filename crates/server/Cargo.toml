[package]
name = "deep-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8.9"
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# OTel uses reqwest 0.13; its blocking client stays separate from inference.
reqwest-otel = { package = "reqwest", version = "0.13", default-features = false, features = ["blocking"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14"
tokio-stream = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
