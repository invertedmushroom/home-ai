name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
      - run: npm ci
      - run: npm run test:scripts
      - run: npm run build:web
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:guests
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.89.0'
      - run: cargo check --workspace --locked
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    env:
      DEEP_BROWSER_PATH: /usr/bin/chromium
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel rust nodejs npm git chromium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:scripts
      - run: npm run build:web
      - run: cargo test --workspace --locked
      - run: npm run test:browser
      - run: npm run test:browser:guests
